# Matches the conventions already established by the other apps on this host (see
# /opt/omnifixlabs/docker-compose.yml and /opt/shopkeeper's) rather than introducing a
# different shape: this app's own private network for its own postgres+api, only the
# frontend additionally joins the external `public-web` network — that's the one shared
# Caddy instance's entry point (its own compose project, not part of this one), which
# already owns ports 80/443 for every app on this host. This project never touches that
# Caddy container directly; adding the new site block to its Caddyfile is a separate step.
name: lims

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-lims}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lims} -d ${POSTGRES_DB:-lims}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [lims-network]
    # No host port published — only other containers on lims-network can reach it.

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      EnableHttpsRedirection: "false"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-lims};Username=${POSTGRES_USER:-lims};Password=${POSTGRES_PASSWORD:?}"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET must be set - see .env.example}
      Cors__AllowedOrigins__0: "https://${DOMAIN:?DOMAIN must be set - see .env.example}"
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD}
    volumes:
      # AttachmentsController's default StorageRoot is {ContentRoot}/App_Data/attachments,
      # which resolves to /app/App_Data/attachments since the final Docker stage's WORKDIR
      # is /app. Without this volume, every redeploy silently deletes every uploaded file.
      - attachments-data:/app/App_Data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    networks: [lims-network]
    # Not published to the host — the frontend container reverse-proxies /api/* to this
    # service internally; nothing outside lims-network needs to reach it directly.

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - api
    # No host port published — the shared Caddy instance (separate compose project,
    # already running on this host) is the sole public entry point and terminates TLS
    # in front of this container. The explicit alias matters: other apps' frontend
    # services are also just named "frontend" in their own compose projects, so without
    # an alias, multiple containers would register the same "frontend" DNS name on the
    # shared network — which one the shared Caddy actually reached would be undefined.
    networks:
      lims-network:
      public-web:
        aliases:
          - lims-frontend

networks:
  lims-network:
    driver: bridge
  public-web:
    external: true

volumes:
  postgres-data:
  attachments-data:
